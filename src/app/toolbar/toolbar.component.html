<mat-toolbar class="dark-toolbar">
  <a routerLink="/" class="brand-link" aria-label="AskNehru Home">
    <span class="brand-title">AskNehru</span>
    <mat-icon class="home-icon">home</mat-icon>
  </a>

  <span class="example-spacer"></span>

  @if (isSuperAdmin) {
  <button class="hide-on-small text-slate-300 hover:text-white" mat-button routerLinkActive="active-link" routerLink="/userlist">User's List</button>
  }

  @if (isUserLoggedIn) {
  <button mat-icon-button [matMenuTriggerFor]="userMenu" class="user-initial-btn" aria-label="User profile">
    <div class="user-initial">{{ initialName | uppercase }}</div>
  </button>
  <mat-menu #userMenu="matMenu">
    <button mat-menu-item routerLink="/dashboard">
      <mat-icon>dashboard</mat-icon>
      <span>Dashboard</span>
    </button>
    <button mat-menu-item (click)="loggedOut()">
      <mat-icon>logout</mat-icon>
      <span>Log Out</span>
    </button>
  </mat-menu>
  }

  @if (!isUserLoggedIn) {
  <button [disabled]="!loggedInTrue" mat-button class="auth-btn-login font-semibold" (click)="openLoginDialog()">Login</button>
  <button [disabled]="signInTrue" mat-button class="auth-btn-signup font-semibold" (click)="openSignupDialog()">Sign Up</button>
  }
</mat-toolbar>
